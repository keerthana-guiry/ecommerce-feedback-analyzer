{% extends "base.html" %}
{% block title %}Edit Feedback{% endblock %}
{% block page_title %}Edit Feedback{% endblock %}
{% block page_sub %}Saving re-runs the sentiment analysis on your review{% endblock %}

{% block content %}
<section class="card card-narrow">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="rating">Rating</label>
      <select id="rating" name="rating" required>
        <option value="5" {% if item.rating == 5 %}selected{% endif %}>5 - Excellent</option>
        <option value="4" {% if item.rating == 4 %}selected{% endif %}>4 - Good</option>
        <option value="3" {% if item.rating == 3 %}selected{% endif %}>3 - Average</option>
        <option value="2" {% if item.rating == 2 %}selected{% endif %}>2 - Poor</option>
        <option value="1" {% if item.rating == 1 %}selected{% endif %}>1 - Terrible</option>
      </select>
    </div>

    <div class="field">
      <label for="review_text">Your Feedback</label>
      <textarea id="review_text" name="review_text" required>{{ item.review_text }}</textarea>
    </div>

    <div class="actions">
      <button type="submit">Update Feedback</button>
      <a class="btn btn-quiet" href="{{ url_for('feedback_history') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
