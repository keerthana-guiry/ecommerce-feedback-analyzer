{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password{% endblock %}
{% block page_sub %}Set a new password for {{ account.username }}. They'll be logged out everywhere.{% endblock %}

{% block content %}
<section class="card card-narrow">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>
    <div class="actions">
      <button type="submit">Reset Password</button>
      <a class="btn btn-quiet" href="{{ url_for('settings.index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
